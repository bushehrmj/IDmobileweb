<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - ID Mobile Manager Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; text-align: center; }
        .subtitle { color: #666; text-align: center; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 600; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            direction: ltr;
            text-align: left;
        }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
        .message { padding: 15px; border-radius: 10px; margin-top: 20px; display: none; font-size: 14px; line-height: 1.6; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info-box { background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 10px; padding: 15px; margin-bottom: 20px; font-size: 13px; color: #856404; line-height: 1.6; }
        code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Password Reset</h1>
        <p class="subtitle">ID Mobile Manager Pro</p>
        
        <div class="info-box">
            <strong>⚠️ Warning:</strong> This tool resets the admin password. After reset, you can login with the new password.
        </div>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" value="admin" readonly style="background: #f5f5f5;">
            </div>
            
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="Minimum 6 characters">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Repeat password">
            </div>
            
            <button type="submit" class="btn">🔑 Reset Password</button>
        </form>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        function hashPassword(password) {
            let hash = 0;
            const salt = 'idmobile_salt_2024';
            const salted = salt + password + salt;
            for (let i = 0; i < salted.length; i++) {
                const char = salted.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return 'h_' + Math.abs(hash).toString(36) + '_' + btoa(salted).slice(0, 20);
        }
        
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            
            if (newPassword.length < 6) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '❌ Password must be at least 6 characters';
                messageDiv.style.display = 'block';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '❌ Passwords do not match';
                messageDiv.style.display = 'block';
                return;
            }
            
            try {
                const usersData = localStorage.getItem('idmobile_users');
                
                if (!usersData) {
                    messageDiv.className = 'message error';
                    messageDiv.innerHTML = '❌ No users data found. Please run the application first.';
                    messageDiv.style.display = 'block';
                    return;
                }
                
                const users = JSON.parse(usersData);
                const adminUser = users.find(u => u.username === 'admin');
                
                if (!adminUser) {
                    messageDiv.className = 'message error';
                    messageDiv.innerHTML = '❌ Admin user not found';
                    messageDiv.style.display = 'block';
                    return;
                }
                
                adminUser.passwordHash = hashPassword(newPassword);
                localStorage.setItem('idmobile_users', JSON.stringify(users));
                
                messageDiv.className = 'message success';
                messageDiv.innerHTML = `
                    ✅ <strong>Password reset successful!</strong><br><br>
                    Username: <code>admin</code><br>
                    New Password: <code>${newPassword}</code><br><br>
                    You can now login with the new password.<br>
                    <a href="http://localhost:3000" style="color: #667eea; font-weight: 600;">→ Login to system</a>
                `;
                messageDiv.style.display = 'block';
                
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '❌ Error: ' + error.message;
                messageDiv.style.display = 'block';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
